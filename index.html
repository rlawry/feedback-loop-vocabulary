<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feedback Words</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Same layout as Selection Sentences: bar on top, word wall in the top part, question panel below that swipes left when done. */
:root {
  --bg: #E9EEEA; --surface: #FFFFFF; --ink: #18211D; --muted: #56625B; --line: #B4C0B7; --grid: #DDE4DE;
  --accent: #1E5A86; --accent-ink: #FFFFFF; --accent-soft: #D7E5F0;
  --good: #2A7448; --good-soft: #D8ECDF; --bad: #AF2B1F; --bad-soft: #F6DBD7; --hot: #C8501A;
  --font: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.35 var(--font); overflow: hidden; overscroll-behavior: none;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
button { font: inherit; color: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; border-radius: 0; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--hot); outline-offset: 2px; }
#app { height: 100%; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, .62fr) minmax(0, 1.38fr); gap: 6px; }
#app.tall { grid-template-rows: auto minmax(0, .42fr) minmax(0, 1.58fr); }

#bar { display: flex; align-items: center; gap: 10px; min-height: 34px; }
#bar h1 { margin: 0; font-size: clamp(16px, 4.4vw, 20px); white-space: nowrap; }
.prog { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.pbar { flex: 1; height: 10px; background: var(--surface); border: 1px solid var(--line); min-width: 30px; }
.pbar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .4s; }
.count { flex: none; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 14px; }
.btn { border: 2px solid var(--line); background: var(--surface); padding: 6px 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.game { background: var(--hot); border-color: var(--hot); color: #fff; padding: 4px 10px; }
.btn:disabled { opacity: .45; cursor: default; }
@media (max-width: 520px) { .pbar { display: none; } .prog { justify-content: flex-end; } #score .lbl { display: none; } #score::before { content: "\2713  "; color: var(--good); } }

/* word wall */
#wall { background: var(--surface); border: 1px solid var(--line); min-height: 0; padding: 6px 8px; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 4px; overflow: hidden; }
#wall h2 { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: 5px; min-height: 0; }
.tile { border: 2px solid var(--line); background: var(--surface); padding: 2px 7px; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 0; overflow: hidden; transition: background .3s, border-color .3s; }
.tile b { font-size: clamp(12.5px, 3.3vw, 15px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.now { border-color: var(--hot); background: #FFF6D8; }
.tile.mast { border-color: var(--good); background: var(--good-soft); }
.pips { display: flex; gap: 3px; flex: none; }
.pips i { width: 10px; height: 10px; border: 2px solid var(--line); display: block; }
.pips i.g { background: var(--good); border-color: var(--good); }
.pips i.r { background: var(--bad); border-color: var(--bad); }
@media (max-width: 700px) { #tiles { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 4px; } .pips i { width: 8px; height: 8px; } #wall h2 { display: none; } #wall { grid-template-rows: minmax(0, 1fr); } }

/* question deck */
#deck { position: relative; overflow: hidden; min-height: 0; }
.panel { position: absolute; inset: 0; background: var(--surface); border: 2px solid var(--ink); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; padding: 8px 12px 10px;
  transition: transform .45s cubic-bezier(.6, 0, .4, 1), opacity .45s; }
.panel.out { transform: translateX(-115%); opacity: .3; }
.panel.in { transform: translateX(115%); transition: none; }
.qhead { display: grid; gap: 2px; }
.qtag { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--accent); }
.qp { margin: 0; font-size: clamp(15px, 4.2vw, 19px); font-weight: 700; text-wrap: balance; }
.qp .def { font-weight: 400; font-style: italic; }
.body { min-height: 0; display: grid; align-content: safe center; gap: 8px; }
.foot { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.fb { flex: 1; margin: 0; font-size: clamp(13px, 3.6vw, 15px); min-width: 0; }
.fb.good b:first-child { color: var(--good); } .fb.bad b:first-child { color: var(--bad); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent); } 50% { box-shadow: 0 0 0 6px transparent; } }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.2s ease-in-out infinite; } }

.opts { display: grid; gap: 8px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts.idea { grid-template-columns: minmax(0, 1fr); }
.opt { border: 2px solid var(--line); background: var(--surface); padding: 10px 8px; cursor: pointer; font-weight: 700; text-align: center; font-size: clamp(15px, 4.2vw, 18px); }
.opts.idea .opt { font-weight: 400; text-align: left; font-size: clamp(13.5px, 3.7vw, 15.5px); padding: 7px 10px; }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; cursor: default; }
.opt.good { background: var(--good-soft); border-color: var(--good); }
.opt:not(:disabled):hover { border-color: var(--accent); }

.sent { margin: 0; font-size: clamp(14.5px, 4vw, 17.5px); line-height: 2.05; }
.lines { display: grid; gap: 0; }
.lines .sent { line-height: 1.9; }
.lines .sent .n { display: inline-block; width: 1.4em; font-weight: 700; color: var(--muted); }
.slot { display: inline-block; min-width: 5.6em; padding: 0 6px; line-height: 1.5; text-align: center; border: 2px dashed var(--accent); background: var(--accent-soft); cursor: pointer; font-weight: 700; vertical-align: baseline; }
.slot.act { border-style: solid; outline: 3px solid var(--hot); outline-offset: 1px; }
.slot.full { border-style: solid; background: var(--surface); }
.slot.ok { border: 2px solid var(--good); background: var(--good-soft); cursor: default; }
.slot.over { background: var(--hot); color: #fff; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.shake { animation: shake .4s; border-color: var(--bad) !important; background: var(--bad-soft) !important; }
.choices, .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { border: 2px solid var(--ink); background: var(--surface); padding: 6px 14px; font-weight: 700; cursor: grab; touch-action: none; user-select: none; }
.chip.sel { background: var(--hot); border-color: var(--hot); color: #fff; }
.choices .chip { cursor: pointer; touch-action: manipulation; }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -60%) rotate(-3deg); box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }
@media (max-width: 700px) {
  .lines .sent { font-size: 14px; line-height: 1.6; margin-bottom: 3px; }
  .slot { min-width: 4.8em; line-height: 1.3; }
  .bank { gap: 6px; } .bank .chip { padding: 4px 11px; }
  .opts { gap: 6px; } .opt { padding: 8px 6px; }
}

.range { position: relative; height: 100%; min-height: 120px; overflow: hidden; background: repeating-linear-gradient(0deg, var(--surface) 0 38px, var(--grid) 38px 39px); border: 1px solid var(--line); cursor: crosshair; }
.tgt { position: absolute; left: 0; top: 0; border: 2px solid var(--ink); background: #FFF6D8; padding: 5px 12px; font-weight: 700; font-size: clamp(14px, 4vw, 17px); cursor: crosshair; white-space: nowrap; will-change: transform; }
.tgt.miss { background: var(--bad-soft); border-color: var(--bad); text-decoration: line-through; opacity: .55; pointer-events: none; }
.tgt.hit { background: var(--good); border-color: var(--good); color: #fff; }
.boom { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border: 3px solid var(--hot); border-radius: 50%; pointer-events: none; animation: boom .45s ease-out forwards; }
@keyframes boom { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }

.endc { display: grid; gap: 10px; justify-items: center; text-align: center; align-content: center; }
.endc h2 { margin: 0; font-size: clamp(20px, 6vw, 28px); }
.endc p { margin: 0; }
.endc .big { font-size: clamp(16px, 5vw, 22px); }

/* "are you sure?" box for anything that erases progress */
#cf { position: fixed; inset: 0; z-index: 60; background: rgba(16, 24, 15, .6); display: grid; place-items: center; padding: 16px; }
#cf .box { background: var(--surface); border: 3px solid var(--ink); max-width: 440px; width: 100%; padding: 18px 18px 16px; display: grid; gap: 12px; }
#cf h2 { margin: 0; font-size: 21px; }
#cf p { margin: 0; font-size: 16px; }
#cf .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
#cf .keep { font-size: 17px; padding: 10px 18px; }
#cf .erase { background: var(--bad); border-color: var(--bad); color: #fff; }
#cf .erase:disabled { opacity: .5; }

/* reward game: Hold the Line */
#hl { position: fixed; inset: 0; z-index: 30; background: #10180F; }
#hc { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.hhud { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 10px; pointer-events: none; flex-wrap: wrap; }
.hhud span { background: rgba(255, 255, 255, .9); border: 2px solid var(--ink); padding: 4px 12px; font-weight: 700; font-size: 17px; font-variant-numeric: tabular-nums; }
.hbtns { position: absolute; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 10px; }
.hb { width: 120px; height: 66px; font: 700 20px var(--font); letter-spacing: .04em; border: 3px solid var(--ink); background: rgba(255, 255, 255, .88); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
#heat.on { background: #D9481F; color: #fff; } #cool.on { background: #2C79C4; color: #fff; }
#hreset { position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding: 6px 12px; min-width: 84px; }
#hreset.armed { background: var(--bad); border-color: var(--bad); color: #fff; white-space: normal; width: 84px; font-size: 13px; }
.hhelp { position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); margin: 0; color: #fff; font-weight: 700; text-shadow: 0 1px 3px #000; text-align: center; font-size: 15px; width: min(52%, 460px); pointer-events: none; }
@media (max-width: 640px) { .hb { width: 92px; height: 58px; font-size: 17px; } .hhelp { bottom: auto; top: calc(56px + env(safe-area-inset-top, 0px)); width: 90%; font-size: 13.5px; } .hhud span { font-size: 14px; } }
#gj { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 22px; background: rgba(16, 24, 15, .92); text-align: center; padding: 20px; }
#gj p { margin: 0; color: #F4F1E6; font-weight: 700; }
#gj .w { font: 700 clamp(56px, 16vw, 150px)/1 var(--font); }
#gj .s { font-size: clamp(17px, 4.6vw, 24px); }
@keyframes wig { 0% { transform: rotate(-5deg) scale(1); } 25% { transform: rotate(5deg) scale(1.06); } 50% { transform: rotate(-3deg) scale(.97); } 75% { transform: rotate(4deg) scale(1.04); } 100% { transform: rotate(-5deg) scale(1); } }
#gj .w { animation: wig .9s ease-in-out infinite; }
#gj div { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
@media (prefers-reduced-motion: reduce) { #gj .w { animation-duration: 3s; } }
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <h1>Feedback Words</h1>
    <div class="prog"><div class="pbar" aria-hidden="true"><i id="pfill"></i></div><span class="count" id="pcount"></span></div>
    <span class="count" id="score"></span>
    <button type="button" class="btn game" id="gameBtn" hidden>Hold the Line</button>
  </header>
  <section id="wall" aria-label="Word wall"><h2>Word wall: a green square for every word you get right on the first try</h2><div id="tiles"></div></section>
  <section id="deck"><div class="panel" id="panel" aria-live="polite"></div></section>
</div>

<div id="cf" hidden role="dialog" aria-modal="true" aria-labelledby="cfh"><div class="box"><h2 id="cfh"></h2><p id="cft"></p><div class="row"><button type="button" class="btn erase" id="cfYes"></button><button type="button" class="btn pri keep" id="cfNo">Keep my progress</button></div></div></div>
<div id="hl" hidden>
  <canvas id="hc" aria-label="Hold the Line: keep body temperature on the set point"></canvas>
  <div class="hhud"><span id="htime">0:45</span><span id="hzone">On the line: 0%</span></div>
  <div class="hbtns"><button type="button" class="hb" id="heat" aria-label="Heat">▲ HEAT</button><button type="button" class="hb" id="cool" aria-label="Cool">▼ COOL</button></div>
  <button type="button" class="btn" id="hreset">Reset</button>
  <p class="hhelp" id="hhelp">You are the control center. Hold HEAT or COOL (or the ▲ ▼ keys) to keep the temperature line on the dashed set point. Watch out for runaway positive feedback!</p>
  <div id="gj" hidden><p class="w">good job.</p><p class="s" id="gjs"></p><div><button type="button" class="btn pri" id="gjAgain">Play again</button><button type="button" class="btn" id="gjBack">Leave the game</button></div></div>
</div>

<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };

/* ---------- the words and their definitions (from the vocabulary sheet and the quiz) ---------- */
var D = {
  'Homeostasis': 'keeping internal conditions steady even when the outside environment changes',
  'Feedback loop': 'a cycle in which a response changes the same condition that set it off',
  'Stimulus': 'a change inside or outside an organism that is detected',
  'Response': 'the action an organism takes because of a stimulus',
  'Set point': 'the normal value or range that a system works to keep',
  'Negative feedback': 'the response reverses the change and moves the system back toward its set point',
  'Positive feedback': 'the response increases the change and moves the system away from its set point',
  'Internal environment': 'the conditions inside an organism, such as temperature, water, and glucose',
  'Regulation': 'controlling a factor so it stays within a normal range',
  'Receptor': 'a sensor that detects a change in conditions',
  'Control center': 'the part of the loop that compares information to the set point and sends instructions',
  'Effector': 'a muscle, gland, or other structure that carries out the response',
  'Hormone': 'a chemical messenger carried in the blood that changes how target cells work'
};
var WORDS = Object.keys(D);
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function def(w) { return w + ': ' + D[w] + '.'; }
function why(w) { return '<b>' + w + '</b> = ' + D[w] + '.'; }

/* ---------- questions ---------- */
/* t: pick | shoot | fill | drag. w: the word(s) the question drills (fills the word wall). */
var Q = [
  { t: 'pick', w: ['Receptor'], tag: 'Name the word', p: 'Which word means: <span class="def">' + D['Receptor'] + '</span>?',
    o: ['Receptor', 'Effector', 'Stimulus', 'Control center'], a: 'Receptor', why: why('Receptor') },
  { t: 'shoot', w: ['Set point'], tag: 'Shoot the word', p: 'Shoot the word that means: <span class="def">' + D['Set point'] + '</span>.',
    targets: ['Set point', 'Stimulus', 'Response', 'Hormone'], a: 'Set point', why: why('Set point') },
  { t: 'fill', w: ['Set point'], tag: 'Finish the definition', p: 'Choose the words to finish the definition.',
    parts: ['A set point is the normal ', { o: ['value or range', 'change', 'response'], a: 'value or range' }, ' that a system works to ', { o: ['keep', 'detect', 'release'], a: 'keep' }, '.'],
    why: why('Set point') },
  { t: 'pick', kind: 'idea', w: ['Effector'], tag: 'Pick the definition', p: 'Which is the definition of <b>effector</b>?',
    o: [cap(D['Effector']) + '.', cap(D['Receptor']) + '.', cap(D['Stimulus']) + '.', cap(D['Control center']) + '.'], a: cap(D['Effector']) + '.', why: why('Effector') },
  { t: 'pick', w: ['Set point'], tag: 'Use the word', p: 'Body temperature should stay near 37 °C. What is 37 °C called?',
    o: ['Set point', 'Stimulus', 'Response', 'Effector'], a: 'Set point', why: '37 °C is the normal value the body works to keep, so it is the <b>set point</b>.' },
  { t: 'drag', w: ['Stimulus', 'Receptor', 'Control center', 'Effector', 'Response'], tag: 'Build the loop', p: 'Drag the words to build the feedback loop.',
    lines: [['A change, called the ', { a: 'stimulus' }, ', happens.'], ['The ', { a: 'receptor' }, ' detects the change.'], ['The ', { a: 'control center' }, ' compares it to the set point and sends instructions.'], ['The ', { a: 'effector' }, ' carries out the ', { a: 'response' }, '.']],
    bank: ['stimulus', 'receptor', 'control center', 'effector', 'response', 'hormone', 'homeostasis'],
    why: 'Stimulus → receptor → control center → effector → response. That order is every feedback loop.' },
  { t: 'shoot', w: ['Feedback loop'], tag: 'Shoot the word', p: 'Shoot the word that means: <span class="def">' + D['Feedback loop'] + '</span>.',
    targets: ['Feedback loop', 'Homeostasis', 'Regulation', 'Response'], a: 'Feedback loop', why: why('Feedback loop') },
  { t: 'fill', w: ['Negative feedback'], tag: 'Finish the definition', p: 'Choose the words to finish the definition.',
    parts: ['In negative feedback, the response ', { o: ['reverses', 'increases'], a: 'reverses' }, ' the change and moves the system ', { o: ['back toward', 'away from'], a: 'back toward' }, ' its set point.'],
    why: why('Negative feedback') },
  { t: 'fill', w: ['Positive feedback'], tag: 'Finish the definition', p: 'Choose the words to finish the definition.',
    parts: ['In positive feedback, the response ', { o: ['reverses', 'increases'], a: 'increases' }, ' the change and moves the system ', { o: ['back toward', 'away from'], a: 'away from' }, ' its set point.'],
    why: why('Positive feedback') },
  { t: 'pick', w: ['Effector'], tag: 'Use the word', p: 'You get cold and start to shiver. In this loop, your shivering muscles are the...',
    o: ['Effector', 'Receptor', 'Stimulus', 'Set point'], a: 'Effector', why: 'The muscles carry out the response (shivering), so they are the <b>effector</b>.' },
  { t: 'pick', kind: 'idea', w: ['Control center'], tag: 'Pick the definition', p: 'Which is the definition of <b>control center</b>?',
    o: [cap(D['Control center']) + '.', cap(D['Receptor']) + '.', cap(D['Effector']) + '.', cap(D['Set point']) + '.'], a: cap(D['Control center']) + '.', why: why('Control center') },
  { t: 'shoot', w: ['Homeostasis'], tag: 'Shoot the word', p: 'Shoot the word that means: <span class="def">' + D['Homeostasis'] + '</span>.',
    targets: ['Homeostasis', 'Regulation', 'Set point', 'Feedback loop'], a: 'Homeostasis', why: why('Homeostasis') },
  { t: 'pick', w: ['Control center'], tag: 'Use the word', p: 'The brain compares body temperature to 37 °C and sends signals to the sweat glands. In this loop, the brain is the...',
    o: ['Control center', 'Effector', 'Receptor', 'Stimulus'], a: 'Control center', why: 'The brain compares to the set point and sends instructions, so it is the <b>control center</b>.' },
  { t: 'pick', w: ['Hormone'], tag: 'Name the word', p: 'Which word means: <span class="def">' + D['Hormone'] + '</span>?',
    o: ['Hormone', 'Receptor', 'Stimulus', 'Effector'], a: 'Hormone', why: why('Hormone') },
  { t: 'fill', w: ['Stimulus'], tag: 'Finish the definition', p: 'Choose the words to finish the definition.',
    parts: ['A stimulus is a ', { o: ['change', 'response', 'messenger'], a: 'change' }, ' inside or outside an organism that is ', { o: ['detected', 'carried out', 'kept steady'], a: 'detected' }, '.'],
    why: why('Stimulus') },
  { t: 'drag', w: ['Negative feedback', 'Positive feedback'], tag: 'Sort the examples', p: 'Drag <b>negative</b> or <b>positive</b> into each blank.',
    lines: [['Shivering warms a cold body back up: ', { a: 'negative' }, ' feedback.'], ['Platelets at a cut attract more and more platelets: ', { a: 'positive' }, ' feedback.'], ['Sweating cools an overheated body: ', { a: 'negative' }, ' feedback.'], ['Contractions push harder and harder until birth: ', { a: 'positive' }, ' feedback.']],
    bank: ['negative', 'positive', 'negative', 'positive'],
    why: 'Negative feedback pulls back toward the set point. Positive feedback pushes the change further and further.' },
  { t: 'shoot', w: ['Response'], tag: 'Shoot the word', p: 'Shoot the word that means: <span class="def">' + D['Response'] + '</span>.',
    targets: ['Response', 'Stimulus', 'Receptor', 'Effector'], a: 'Response', why: why('Response') },
  { t: 'pick', kind: 'idea', w: ['Feedback loop'], tag: 'Pick the definition', p: 'Which is the definition of <b>feedback loop</b>?',
    o: [cap(D['Feedback loop']) + '.', cap(D['Homeostasis']) + '.', cap(D['Regulation']) + '.', cap(D['Positive feedback']) + '.'], a: cap(D['Feedback loop']) + '.', why: why('Feedback loop') },
  { t: 'pick', w: ['Receptor'], tag: 'Use the word', p: 'Sensors in your skin notice that the air turned cold. In this loop, the skin sensors are the...',
    o: ['Receptor', 'Effector', 'Control center', 'Response'], a: 'Receptor', why: 'The skin sensors detect the change, so they are the <b>receptor</b>.' },
  { t: 'pick', w: ['Stimulus'], tag: 'Use the word', p: 'Your body temperature drops. In this loop, the drop in temperature is the...',
    o: ['Stimulus', 'Response', 'Set point', 'Hormone'], a: 'Stimulus', why: 'The drop is the change that gets detected, so it is the <b>stimulus</b>.' },
  { t: 'fill', w: ['Effector'], tag: 'Finish the definition', p: 'Choose the words to finish the definition.',

  var v = G.v, hot = Math.max(0, Math.min(1, v / 3)), cold = Math.max(0, Math.min(1, -v / 3));
  var bgc = [16 + hot * 70 - cold * 4, 24 + hot * 10 + cold * 18, 15 + cold * 70];
  c.fillStyle = 'rgb(' + bgc.map(Math.round).join(',') + ')'; c.fillRect(0, 0, GW, GH);
  G.parts.forEach(function (p) { if (p.k === 'snow') { c.fillStyle = 'rgba(235,245,255,.85)'; c.beginPath(); c.arc(p.x, p.y, 3, 0, 7); c.fill(); } else { c.fillStyle = 'rgba(255,183,3,.75)'; c.fillRect(p.x, p.y, 2, 12); } });
  if (G.dK === 'sun') { c.fillStyle = '#FFB703'; c.beginPath(); c.arc(GW - 90, 110, 34, 0, 7); c.fill(); }
  if (G.dK === 'snow') { c.strokeStyle = '#EAF4FF'; c.lineWidth = 4; for (var i = 0; i < 3; i++) { var a = i * Math.PI / 3; c.beginPath(); c.moveTo(GW - 90 + Math.cos(a) * 30, 110 + Math.sin(a) * 30); c.lineTo(GW - 90 - Math.cos(a) * 30, 110 - Math.sin(a) * 30); c.stroke(); } }
  var mid = GH * .5, sc = GH * .1, xNow = GW * .72, pxs = (xNow - 40) / 8;
  c.fillStyle = 'rgba(57,217,138,.18)'; c.fillRect(0, mid - BAND * sc, GW, BAND * 2 * sc);
  c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.setLineDash([10, 8]); c.beginPath(); c.moveTo(0, mid); c.lineTo(GW, mid); c.stroke(); c.setLineDash([]);
  if (G.run) { c.strokeStyle = 'rgba(255,60,60,' + (.5 + .4 * Math.sin(G.t * 12)) + ')'; c.lineWidth = 14; c.strokeRect(7, 7, GW - 14, GH - 14);
    c.fillStyle = '#fff'; c.font = '700 ' + (GW < 640 ? 18 : 22) + 'px ' + getComputedStyle(document.body).fontFamily; c.textAlign = 'center';
    if (GW < 640) { c.fillText('RUNAWAY! Positive feedback!', GW / 2, GH * .25); c.fillText('Push back!', GW / 2, GH * .25 + 24); } else c.fillText('RUNAWAY! Positive feedback is pushing it away. Push back!', GW / 2, GH * .2); }
  c.strokeStyle = '#FFD6A0'; c.lineWidth = 4; c.lineJoin = 'round'; c.beginPath();
  G.trace.forEach(function (p, i) { var x = xNow - (G.t - p[0]) * pxs, y = mid - p[1] * sc; i ? c.lineTo(x, y) : c.moveTo(x, y); }); c.stroke();
  var on = Math.abs(v) <= BAND; c.fillStyle = on ? '#39D98A' : '#FF5A5A'; c.beginPath(); c.arc(xNow, mid - v * sc, 13, 0, 7); c.fill();
  c.strokeStyle = '#fff'; c.lineWidth = 3; c.stroke();
  if (G.flash > 0) { c.fillStyle = 'rgba(255,40,40,' + (.12 + .1 * Math.sin(G.t * 10)) + ')'; c.fillRect(0, 0, GW, GH); }
}
function hold(btn, k) {
  function on(e) { e.preventDefault(); if (G) G.keys[k] = 1; btn.classList.add('on'); try { btn.setPointerCapture(e.pointerId); } catch (x) {} }
  function off() { if (G) G.keys[k] = 0; btn.classList.remove('on'); }
  btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off); btn.addEventListener('pointercancel', off); btn.addEventListener('lostpointercapture', off);
}
hold($('#heat'), 'u'); hold($('#cool'), 'd');
document.addEventListener('keydown', function (e) {
  if (!G) return;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { G.keys.u = 1; $('#heat').classList.add('on'); e.preventDefault(); }
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { G.keys.d = 1; $('#cool').classList.add('on'); e.preventDefault(); }
});
document.addEventListener('keyup', function (e) {
  if (!G) return;
  if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { G.keys.u = 0; $('#heat').classList.remove('on'); }
  if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { G.keys.d = 0; $('#cool').classList.remove('on'); }
});

(function resume() {
  var p = saved.prog; if (!p) return;
  cur = Math.max(0, Math.min(Q.length, p.cur | 0)); first = p.first | 0;
  WORDS.forEach(function (w) { if (p.marks && Array.isArray(p.marks[w])) marks[w] = p.marks[w].slice(0, NEEDW[w]); });
  if (p.done && cur < Q.length) cur++;
  else resumeMiss = p.miss | 0;   /* a miss before reloading still counts, so reloading can't erase a wrong answer */
})();
drawWall(); if (cur >= Q.length) { endCard(true); } else render(); bar();
})();
